Transform: "AWS::Serverless-2016-10-31"
Metadata:
  AWS::ServerlessRepo::Application:
    Name: serverless-iiif
    Description: IIIF Image API 2.1 and 3.0 Service Lambda Function
    Author: Samvera
    SpdxLicenseId: Apache-2.0
    LicenseUrl: ./LICENSE.txt
    ReadmeUrl: ./README.md
    Labels: ["iiif", "image-processing"]
    HomePageUrl: https://samvera.github.io/serverless-iiif
    SemanticVersion: 8.0.5
    SourceCodeUrl: https://github.com/samvera/serverless-iiif
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General Configuration"
        Parameters:
          - SourceBucket
          - IiifLambdaMemory
          - IiifLambdaTimeout
          - PixelDensity
          - PyramidLimit
          - ResolverTemplate
      - Label:
          default: "CORS Configuration"
        Parameters:
          - CorsAllowCredentials
          - CorsAllowHeaders
          - CorsAllowOrigin
          - CorsExposeHeaders
          - CorsMaxAge
      - Label:
          default: "Content Credentials Configuration"
        Parameters:
          - C2PASupport
          - C2PACertificate
          - C2PAKey
          - C2PATSAUrl
          - C2PAReserveSize
          - C2PASoftwareAgent
      - Label:
          default: "Advanced Options"
        Parameters:
          - ForceHost
          - Preflight
Parameters:
  C2PASupport:
    Type: String
    Description: Indicates whether to deploy with C2PA support enabled (makes deploy package larger).
    AllowedValues:
      - false
      - true
    Default: false
  C2PACertificate:
    Type: String
    Description: Base64-encoded C2PA certificate to use for signing.
    Default: ""
  C2PAKey:
    Type: String
    Description: Base64-encoded C2PA private key to use for signing.
    Default: ""
  C2PASoftwareAgent:
    Type: String
    Description: Software agent to use for C2PA signing.
    Default: ""
  C2PATSAUrl:
    Type: String
    Description: URL of the C2PA Time Stamping Authority (TSA) to use for signing. Optional; if not provided, no timestamp will be added to the signature.
    Default: "http://timestamp.digicert.com"
  C2PAReserveSize:
    Type: String
    Description: Size in bytes to reserve for the C2PA signature. Optional; if not provided, the default size will be used.
    AllowedPattern: "^[0-9]*$"
    Default: ""
  CorsAllowCredentials:
    Type: String
    Description: >
      Value of the CORS `Access-Control-Allow-Credentials` response header. Must
      be `true` to allow requests with `Authorization` and/or `Cookie` headers.
    AllowedValues:
      - false
      - true
    Default: false
  CorsAllowHeaders:
    Type: String
    Description: Value of the CORS `Access-Control-Allow-Headers` response header
    Default: "*"
  CorsAllowOrigin:
    Type: String
    Description: >
      Value of the CORS `Access-Control-Allow-Origin` response header. Use the
      special value `REFLECT_ORIGIN` to copy the value from the `Origin` request
      header (required to emulate `*` for XHR requests using `Authorization`
      and/or `Cookie` headers).
    Default: "*"
  CorsExposeHeaders:
    Type: String
    Description: Value of the CORS `Access-Control-Expose-Headers` response header
    Default: cache-control,content-language,content-length,content-type,date,expires,last-modified,pragma
  CorsMaxAge:
    Type: Number
    Description: Value of the CORS `Access-Control-MaxAge` response header
    Default: 3600
  CreateMetadataFunction:
    Type: String
    Description: >
      Indicates whether to create the additional Lambda function used for metadata generation.
      ***NOTE: Enabling this feature will give the function full read/write permissions to 
      the image source bucket.***
    AllowedValues:
      - false
      - true
    Default: false
  ForceHost:
    Type: String
    Description: Forced hostname to use in responses
    Default: ""
  IiifLambdaMemory:
    Type: Number
    Description: The memory provisioned for the lambda.
    MinValue: 128
    MaxValue: 10240
    Default: 3008
  IiifLambdaTimeout:
    Type: Number
    Description: The timeout for the lambda.
    Default: 10
  PixelDensity:
    Type: Number
    Description: Hardcoded DPI/Pixel Density/Resolution to encode in output images
    Default: 0
    MinValue: 0
  Preflight:
    Type: String
    Description: Indicates whether the function should expect preflight headers
    AllowedValues:
      - false
      - true
    Default: false
  PyramidLimit:
    Type: Number
    Description:
      Smallest pyramid image dimension. Set to `0` to prevent server from
      auto-calculating pyramid page sizes.
    MinValue: 0
    Default: 0
  ResolverTemplate:
    Type: String
    Description:
      A printf-style format string that determines the location of source
      image within the bucket given the image ID
    Default: "%s.tif"
  SourceBucket:
    Type: String
    Description: Name of bucket containing source images
Conditions:
  CreateMetadataFunction:
    Fn::Equals: [!Ref CreateMetadataFunction, "true"]
  DeployC2PA:
    Fn::Equals: [!Ref C2PASupport, "true"]
  UseForceHost:
    Fn::Not:
      - Fn::Equals: [!Ref ForceHost, ""]
  UsePixelDensity:
    Fn::Not:
      - Fn::Equals: [!Ref PixelDensity, 0]
  UsePyramidLimit:
    Fn::Not:
      - Fn::Equals: [!Ref PyramidLimit, 0]
Resources:
  C2PALayer:
    Condition: DeployC2PA
    Type: "AWS::Serverless::LayerVersion"
    Properties:
      LayerName:
        Fn::Sub: "${AWS::StackName}-c2pa"
      Description: C2PA support for IIIF app
      ContentUri: ./c2pa-layer
      CompatibleRuntimes:
        - nodejs24.x
      LicenseInfo: "MIT"
    Metadata:
      BuildMethod: makefile
  Dependencies:
    Type: "AWS::Serverless::LayerVersion"
    Properties:
      LayerName:
        Fn::Sub: "${AWS::StackName}-dependencies"
      Description: Dependencies for IIIF app
      ContentUri: ./dependencies
      CompatibleRuntimes:
        - nodejs24.x
      LicenseInfo: "Apache-2.0"
    Metadata:
      BuildMethod: makefile
  IiifFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize:
        Ref: IiifLambdaMemory
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Timeout:
        Ref: IiifLambdaTimeout
      CodeUri: ./src
      Layers:
        - !Ref Dependencies
        - Fn::If:
            - DeployC2PA
            - Ref: C2PALayer
            - !Ref AWS::NoValue
      Policies:
        - AWSLambdaExecute
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:ListAllMyBuckets
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectACL
              Resource:
                Fn::Sub: "arn:aws:s3:::${SourceBucket}/*"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                Fn::Sub: "arn:aws:s3:::${SourceBucket}"
      Environment:
        Variables:
          corsAllowCredentials: !Ref CorsAllowCredentials
          corsAllowOrigin: !Ref CorsAllowOrigin
          corsAllowHeaders: !Ref CorsAllowHeaders
          corsExposeHeaders: !Ref CorsExposeHeaders
          corsMaxAge: !Ref CorsMaxAge
          density:
            Fn::If:
              - UsePixelDensity
              - !Ref PixelDensity
              - !Ref AWS::NoValue
          forceHost:
            Fn::If:
              - UseForceHost
              - !Ref ForceHost
              - !Ref AWS::NoValue
          preflight: !Ref Preflight
          pyramidLimit:
            Fn::If:
              - UsePyramidLimit
              - !Ref PyramidLimit
              - !Ref AWS::NoValue
          resolverTemplate: !Ref ResolverTemplate
          sourceBucket: !Ref SourceBucket
          C2PA_CERTIFICATE:
            Fn::If:
              - DeployC2PA
              - !Ref C2PACertificate
              - !Ref AWS::NoValue
          C2PA_KEY:
            Fn::If:
              - DeployC2PA
              - !Ref C2PAKey
              - !Ref AWS::NoValue
          C2PA_TSA_URL:
            Fn::If:
              - DeployC2PA
              - !Ref C2PATSAUrl
              - !Ref AWS::NoValue
          C2PA_RESERVE_SIZE:
            Fn::If:
              - DeployC2PA
              - !Ref C2PAReserveSize
              - !Ref AWS::NoValue
          C2PA_SOFTWARE_AGENT:
            Fn::If:
              - DeployC2PA
              - !Ref C2PASoftwareAgent
              - !Ref AWS::NoValue
          C2PA_LIBRARY_PATH:
            Fn::If:
              - DeployC2PA
              - "/opt/index.node"
              - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: false
        SourceMap: false
        Target: es2022
        External:
          - "@contentauth/c2pa-node"
          - sharp
  MetadataFunction:
    Condition: CreateMetadataFunction
    Type: "AWS::Serverless::Function"
    Properties:
      Runtime: nodejs24.x
      Handler: utils/create-metadata.handler
      Timeout: 90
      MemorySize: 512
      CodeUri: ./src
      Layers:
        - !Ref Dependencies
      Policies:
        - AWSLambdaExecute
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:ListAllMyBuckets
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:CopyObject
                - s3:GetObject
                - s3:GetObjectACL
                - s3:PutObject
              Resource:
                Fn::Sub: "arn:aws:s3:::${SourceBucket}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                Fn::Sub: "arn:aws:s3:::${SourceBucket}"
      Environment:
        Variables:
          resolverTemplate: !Ref ResolverTemplate
          sourceBucket: !Ref SourceBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - utils/create-metadata.ts
        Minify: false
        SourceMap: false
        Target: es2022
        External:
          - sharp
Outputs:
  EndpointV2:
    Description: IIIF Image API v2 Endpoint
    Value:
      Fn::Sub: "${IiifFunctionUrl.FunctionUrl}iiif/2"
  EndpointV3:
    Description: IIIF Image API v3 Endpoint
    Value:
      Fn::Sub: "${IiifFunctionUrl.FunctionUrl}iiif/3"
  FunctionDomain:
    Description: IIIF Function Domain Name
    Value:
      Fn::Select:
        - 2
        - Fn::Split:
            - "/"
            - Fn::GetAtt: IiifFunctionUrl.FunctionUrl
  FunctionUrl:
    Description: IIIF Function URL
    Value:
      Fn::GetAtt: IiifFunctionUrl.FunctionUrl
  MetadataFunctionArn:
    Condition: CreateMetadataFunction
    Description: ARN of the metadata Lambda function (only created if `CreateMetadataFunction` is `true`)
    Value:
      Fn::GetAtt: MetadataFunction.Arn
