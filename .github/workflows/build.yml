---
name: Build Project
on:
  - push
concurrency:
  group: "builds"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: jdx/mise-action@v4
      - name: Install Dependencies
        run: npm ci
      - name: Install esbuild globally
        run: |
          esbuild_version=$(npm list esbuild | grep esbuild | cut -d '@' -f 2 | head -n 1)
          npm install -g --allow-scripts=esbuild esbuild@${esbuild_version}
      - uses: aws-actions/setup-sam@v3
      - name: Build
        run: ./bin/build build
      - name: Verify Build
        run: ./bin/build test-build
